version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: nestjs-backend
    ports:
      - "5000:5000"
      - "9229:9229"
    environment:
      - NODE_ENV=development
      - APP_PORT=5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=nestjs_dev
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres123
      - JWT_ACCESS_TOKEN_SECRET_KEY=dev-jwt-secret
      - JWT_ACCESS_TOKEN_EXPIRED_IN=86400
      - JWT_REFRESH_TOKEN_SECRET_KEY=dev-refresh-secret
      - JWT_REFRESH_TOKEN_EXPIRED_IN=604800
      - LOG_LEVEL=debug
      - LOG_ENABLE_LOG_TO_FILE=true
      - LOG_ROOT_FOLDER=/app/logs
      - LOG_MAX_FILES=10
      - LOG_MAX_SIZE=10000000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=fake-local-key
      - AWS_SECRET_ACCESS_KEY=fake-local-secret
      - AWS_S3_BUCKET=fake-local-bucket
      - AWS_S3_SIGNED_URL_EXPIRED_IN_SECOND=3600
      - CLOUD_FRONT_URL=https://fake.cloudfront.local
    volumes:
      - .:/app
      - /app/node_modules
      - backend-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nestjs-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: nestjs-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=nestjs_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nestjs-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nestjs-network:
    driver: bridge

volumes:
  postgres-data:
  backend-logs:
