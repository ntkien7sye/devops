name: CI/CD Pipeline

on:
  push:
    branches: [main, production, devlocal]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nestjs-backend-dev-backend
  EKS_CLUSTER_NAME: nestjs-backend-dev-eks
  KUBERNETES_NAMESPACE: nestjs-backend

permissions:
  id-token: write
  contents: read

jobs:
  # Lint & Test
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  # Build & Push to ECR
  build-push:
    name: Build & Push
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to EKS
  deploy:
    name: Deploy to EKS
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --query 'repositories[0].repositoryUri' --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Deploy to Kubernetes
        run: |
          cd kubernetes
          cat deployment.yaml | sed "s|\${ECR_REPOSITORY_URL}|${{ steps.ecr.outputs.url }}|g" | sed "s|:latest|:${{ github.sha }}|g" | kubectl apply -f -
          kubectl apply -f namespace.yaml
          kubectl apply -f configmap.yaml
          kubectl apply -f service.yaml
          kubectl apply -f ingress.yaml
          kubectl apply -f hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/nestjs-backend -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=300s

  # Notify Slack
  notify:
    name: Slack Notification
    needs: [lint-test, build-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          STATUS="${{ needs.deploy.result == 'success' && 'SUCCESS' || 'FAILED' }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Pipeline $STATUS: ${{ github.repository }}@${{ github.ref_name }}\"}" \
            "$SLACK_WEBHOOK_URL"
